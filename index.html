/* =====================================================
   雲端同步

const API_BASE =

const NAMESPACE =

let syncCode =

    ) || "";

let activeItems = [];

let historyItems = [];

let pollTimer = null;

let isSaving = false;

/* =====================================================
   快捷
===================================================== */

const $ = id =>
    document.getElementById(id);


/* =====================================================
   狀態
===================================================== */

function setSyncStatus(
    text,
    type = ""
) {

    $("syncStatus").textContent =
        text;

    $("syncStatus").className =
        "sync-status " + type;

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   日期
===================================================== */

function getTodayString() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


function formatDate(
    dateString
) {

    if (!dateString) {
        return "";
    }

    const parts =
        dateString.split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    return `${parts[0]}/${parts[1]}/${parts[2]}`;

}


/* =====================================================
   天數
===================================================== */

function dateToNumber(
    dateString
) {

    const parts =
        dateString
            .split("-")
            .map(Number);

    if (parts.length !== 3) {
        return NaN;
    }

    return Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2]
    );

}


function getDays(
    startDate,
    endDate = getTodayString()
) {

    const start =
        dateToNumber(
            startDate
        );

    const end =
        dateToNumber(
            endDate
        );

    if (
        !Number.isFinite(start) ||
        !Number.isFinite(end)
    ) {

        return 1;

    }

    const difference =
        end - start;

    return Math.max(
        1,
        Math.floor(
            difference /
            86400000
        ) + 1
    );

}


/* =====================================================
   同步碼
===================================================== */

function randomSyncCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }

    return code;

}
